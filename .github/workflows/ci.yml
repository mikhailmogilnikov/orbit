name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # A PR's new push replaces its old run; every push to master gets its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    name: macOS — tests and app build
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Install tools
        # SwiftTerm's shaders need the Metal Toolchain.
        run: |
          brew install xcodegen
          xcodebuild -downloadComponent MetalToolchain
          git config --global user.name CI
          git config --global user.email ci@localhost
      - uses: actions/cache@v4
        with:
          path: |
            Packages/OrbitKit/.build
            .build/xcode/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/OrbitKit/Package.resolved', 'project.yml') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Test
        # Tests take seconds once built; a run still going after 10 minutes is
        # hung, so print what every thread waits on instead of timing out silently.
        timeout-minutes: 25
        run: |
          make test &
          pid=$!
          for _ in $(seq 600); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          if kill -0 $pid 2>/dev/null; then
            echo "::error::Tests still running after 10 minutes"
            ps -ax -o pid,ppid,etime,command | grep -v -e '^ *[0-9]* *1 ' | tail -40
            for p in $(pgrep -f 'swiftpm-testing-helper|OrbitKitPackageTests'); do
              sample $p 3 -mayDie 2>&1 | head -600
            done
            pkill -f 'swiftpm-testing-helper|OrbitKitPackageTests'; kill $pid
            exit 1
          fi
          wait $pid
      - name: Build the app
        run: make build

  linux:
    # The language-server client also builds on Linux (D55); servers aren't
    # installed here, so their integration tests skip themselves.
    name: Linux — language-server client
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test
        working-directory: Packages/OrbitKit
        run: swift test --filter "LanguageServer|Completion"
