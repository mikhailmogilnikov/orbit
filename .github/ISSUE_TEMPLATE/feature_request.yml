name: Feature request
description: An idea for Orbit
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Orbit has strong product opinions — [product.md](https://github.com/mikhailmogilnikov/orbit/blob/master/docs/product.md) explains them.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work. Mention other editors that do it well.
