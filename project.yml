name: Orbit
options:
  bundleIdPrefix: dev.orbit
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  OrbitKit:
    path: Packages/OrbitKit

targets:
  Orbit:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: OrbitKit
        product: OrbitKit
    settings:
      base:
        PRODUCT_NAME: Orbit
        PRODUCT_BUNDLE_IDENTIFIER: dev.orbit.app
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        # Merged into the generated one: folders can be opened with Orbit (D102).
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Orbit
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # Agents spawn arbitrary CLIs, so the App Sandbox is off (direct distribution).
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEAD_CODE_STRIPPING: YES
